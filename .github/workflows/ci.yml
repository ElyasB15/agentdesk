name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App (types et compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler
        run: npm run build

  docker:
    name: Docker (compose et image)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Valider le docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Construire l'image
        run: docker build -t agentdesk-app:ci ./app